<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web VLC Player</title>

  <!-- ArtPlayer UI CSS -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; }
    
    header { padding: 20px; font-size: 24px; font-weight: bold; color: #ff8800; display: flex; align-items: center; gap: 10px; }

    .container { padding: 20px; }
    .section-title { font-size: 18px; margin-bottom: 15px; color: #ff8800; }

    .stream-card {
      width: 140px; height: 120px; border: 2px dashed #ff8800; border-radius: 12px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; transition: 0.2s; background: rgba(255, 136, 0, 0.05);
    }
    .stream-card:hover { background: rgba(255, 136, 0, 0.15); }
    .stream-card .icon { font-size: 32px; color: #ff8800; margin-bottom: 5px; }

    /* Modal Styling */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 10; }
    .modal-content { background: #222; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; }
    .modal-content h3 { margin-bottom: 15px; }
    .modal-content input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; margin-bottom: 15px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-orange { background: #ff8800; color: white; }
    .btn-cancel { background: #444; color: white; }

    /* Fullscreen Player Container */
    #player-wrapper { display: none; width: 100vw; height: 100vh; position: fixed; inset: 0; background: black; z-index: 20; }
    .close-player { position: absolute; top: 15px; right: 15px; z-index: 25; background: rgba(0,0,0,0.6); color: white; border: none; padding: 10px 15px; border-radius: 50%; cursor: pointer; font-size: 18px; }
    
    #artplayer { width: 100%; height: 100%; }
  </style>

  <!-- ArtPlayer Library & HLS Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <header>
    <span style="font-size:30px; color:#ff8800;">🍊</span> Web VLC
  </header>

  <div class="container">
    <div class="section-title">Streams</div>
    <div class="stream-card" onclick="toggleModal(true)">
      <div class="icon">+</div>
      <div>New stream</div>
    </div>
  </div>

  <!-- Modal for Stream URL & External Subtitle -->
  <div class="modal" id="streamModal">
    <div class="modal-content">
      <h3>Enter Stream Details</h3>
      <input type="text" id="streamUrlInput" placeholder="Stream URL (.m3u8, .mp4, .mkv)">
      <input type="text" id="subtitleUrlInput" placeholder="Subtitle URL (.vtt or .srt) [Optional]">
      <div class="modal-buttons">
        <button class="btn btn-cancel" onclick="toggleModal(false)">Cancel</button>
        <button class="btn btn-orange" onclick="startPlayback()">Play</button>
      </div>
    </div>
  </div>

  <!-- Player Wrapper -->
  <div id="player-wrapper">
    <button class="close-player" onclick="stopPlayback()">✕</button>
    <div id="artplayer"></div>
  </div>

  <script>
    let art;

    function toggleModal(show) {
      document.getElementById('streamModal').style.display = show ? 'flex' : 'none';
    }

    function startPlayback() {
      const inputUrl = document.getElementById('streamUrlInput').value.trim();
      const subtitleUrl = document.getElementById('subtitleUrlInput').value.trim();
      
      if (!inputUrl) return;

      toggleModal(false);
      document.getElementById('player-wrapper').style.display = 'block';

      // Go Backend Proxy URL
      const proxyUrl = `/proxy?url=${encodeURIComponent(inputUrl)}`;

      if (art) {
        art.destroy();
      }

      art = new Artplayer({
        container: '#artplayer',
        url: proxyUrl,
        type: inputUrl.includes('.m3u8') ? 'm3u8' : 'auto',
        customType: {
          m3u8: function (video, url) {
            if (Hls.isSupported()) {
              const hls = new Hls();
              hls.loadSource(url);
              hls.attachMedia(video);
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
              video.src = url;
            }
          },
        },
        // Features & Options
        setting: true,
        flip: true,
        playbackRate: true,
        aspectRatio: true,
        fullscreen: true,
        fullscreenWeb: true,
        subtitleOffset: true,
        miniProgressBar: true,
        mutex: true,
        backdrop: true,
        playsInline: true,
        autoPlayback: true,
        
        // Subtitle Configuration
        subtitle: subtitleUrl ? {
          url: `/proxy?url=${encodeURIComponent(subtitleUrl)}`,
          type: subtitleUrl.endsWith('.srt') ? 'srt' : 'vtt',
          style: {
            color: '#fff',
            fontSize: '24px',
          },
        } : {},

        // Custom Control Buttons (Time Skip -10s / +10s)
        controls: [
          {
            name: 'rewind',
            position: 'left',
            index: 10,
            html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>',
            tooltip: 'Backward 10s',
            click: function () {
              art.seek = Math.max(0, art.currentTime - 10);
            },
          },
          {
            name: 'forward',
            position: 'left',
            index: 11,
            html: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7M5 5l7 7-7 7"/></svg>',
            tooltip: 'Forward 10s',
            click: function () {
              art.seek = Math.min(art.duration, art.currentTime + 10);
            },
          },
        ],
      });
    }

    function stopPlayback() {
      if (art) {
        art.destroy();
      }
      document.getElementById('player-wrapper').style.display = 'none';
    }
  </script>
</body>
  </html>
